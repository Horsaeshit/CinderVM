<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 452" width="860" height="452" role="img"
     aria-label="Terminal recording: cinderc compiles triage.cdx, cinder run executes it, cinder replay seeks to a checkpoint">
  <defs>
    <style>
      .m  { font-family: "SFMono-Regular", "JetBrains Mono", Consolas, monospace; font-size: 13px; }
      .p  { fill: #56d364; }
      .c  { fill: #e6edf3; }
      .d  { fill: #8b949e; }
      .k  { fill: #79c0ff; }
      .w  { fill: #d29922; }
      .g  { fill: #3fb950; }
      .v  { fill: #bc8cff; }
      .s  { fill: #ffa657; }
    </style>
    <clipPath id="body"><rect x="0" y="40" width="860" height="412"/></clipPath>
  </defs>

  <rect width="860" height="452" rx="10" fill="#0d1117"/>
  <rect width="860" height="40" rx="10" fill="#161b22"/>
  <rect y="30" width="860" height="10" fill="#161b22"/>
  <line x1="0" y1="40" x2="860" y2="40" stroke="#30363d"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="20" r="6" fill="#febc2e"/>
  <circle cx="62" cy="20" r="6" fill="#28c840"/>
  <text class="m d" x="430" y="25" text-anchor="middle">cindervm — examples/triage</text>

  <g clip-path="url(#body)">

    <!-- ── act 1: compile ───────────────────────────────────────────── -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.01s" fill="freeze"/>
      <text class="m" x="18" y="70"><tspan class="p">$</tspan><tspan class="c" x="36"> cinderc triage.cdx -o triage.cdxb</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="1.1s" dur="0.01s" fill="freeze"/>
      <text class="m" x="18" y="92"><tspan class="k">   compiled</tspan><tspan class="c">  triage.cdxb   </tspan><tspan class="d">264 B   1 fn   14 insns   maxstack 6</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="1.5s" dur="0.01s" fill="freeze"/>
      <text class="m" x="18" y="112"><tspan class="g">   verified</tspan><tspan class="c">  frames=14/14  types=ok  stack=ok  effects=ok    </tspan><tspan class="d">1.9 ms</tspan></text>
    </g>

    <!-- ── act 2: run ───────────────────────────────────────────────── -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="2.2s" dur="0.01s" fill="freeze"/>
      <text class="m" x="18" y="146"><tspan class="p">$</tspan><tspan class="c" x="36"> cinder run triage.cdxb --arg "segfault on startup" --journal run.jl</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="3.0s" dur="0.01s" fill="freeze"/>
      <text class="m" x="18" y="168"><tspan class="d">   [0000]</tspan><tspan class="k">  calltool</tspan><tspan class="c">  llm.complete</tspan><tspan class="s" x="330">↑ 41 tok</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="3.7s" dur="0.01s" fill="freeze"/>
      <text class="m" x="18" y="188"><tspan class="d">   [0001]</tspan><tspan class="k">  await</tspan><tspan class="s" x="330">↓ 3 tok</tspan><tspan class="d" x="410">612 ms</tspan><tspan class="c" x="480">"critical"</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="4.1s" dur="0.01s" fill="freeze"/>
      <text class="m" x="18" y="208"><tspan class="d">   [0002]</tspan><tspan class="v">  checkpoint</tspan><tspan class="c"> pre-label</tspan><tspan class="v" x="330">● 1.4 KB</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="4.5s" dur="0.01s" fill="freeze"/>
      <text class="m" x="18" y="228"><tspan class="d">   [0003]</tspan><tspan class="k">  calltool</tspan><tspan class="c">  github.issue.label</tspan><tspan class="d" x="330">↑ —</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="5.0s" dur="0.01s" fill="freeze"/>
      <text class="m" x="18" y="248"><tspan class="d">   [0004]</tspan><tspan class="k">  await</tspan><tspan class="d" x="330">↓ —</tspan><tspan class="d" x="410">208 ms</tspan><tspan class="g" x="480">ok</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="5.4s" dur="0.01s" fill="freeze"/>
      <text class="m" x="18" y="270"><tspan class="g">   halt 0</tspan><tspan class="d">      wall 0.83 s   tokens 44/8000   tools 2/6</tspan></text>
    </g>

    <!-- ── act 3: replay ────────────────────────────────────────────── -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="6.2s" dur="0.01s" fill="freeze"/>
      <text class="m" x="18" y="304"><tspan class="p">$</tspan><tspan class="c" x="36"> cinder replay run.jl --seek 0002 --inspect stack</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="7.0s" dur="0.01s" fill="freeze"/>
      <text class="m" x="18" y="326"><tspan class="v">   stack</tspan><tspan class="c">  [0] str  "critical"    </tspan><tspan class="d">(heap #3, 8 B)</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="7.3s" dur="0.01s" fill="freeze"/>
      <text class="m" x="18" y="346"><tspan class="v">   frame</tspan><tspan class="c">  main  </tspan><tspan class="d">pc=0x1a  depth=1/6</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="7.6s" dur="0.01s" fill="freeze"/>
      <text class="m" x="18" y="366"><tspan class="v">   budget</tspan><tspan class="d"> tokens 44  wall 0.61s  tools 1</tspan></text>
    </g>

    <!-- ── act 4: replay verification ───────────────────────────────── -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="8.3s" dur="0.01s" fill="freeze"/>
      <text class="m" x="18" y="400"><tspan class="p">$</tspan><tspan class="c" x="36"> cinder replay run.jl --verify-replay</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="9.1s" dur="0.01s" fill="freeze"/>
      <text class="m" x="18" y="422"><tspan class="g">   ✓</tspan><tspan class="c"> 5/5 states match recorded digests   </tspan><tspan class="g">✓</tspan><tspan class="c"> chain intact </tspan><tspan class="d">(head 3d84…)</tspan></text>
    </g>

    <!-- cursor: parked at each prompt, then final -->
    <rect class="cur" x="36" y="59" width="8" height="15" fill="#56d364">
      <animate attributeName="opacity" values="1;1;0;1" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="x" values="36;308;36;544;36;422;36;340" keyTimes="0;0.03;0.24;0.27;0.66;0.69;0.88;0.91"
               dur="11s" fill="freeze" calcMode="discrete"/>
      <animate attributeName="y" values="59;59;135;135;293;293;389;389" keyTimes="0;0.03;0.24;0.27;0.66;0.69;0.88;0.91"
               dur="11s" fill="freeze" calcMode="discrete"/>
    </rect>

    <!-- loop marker -->
    <animate attributeName="opacity" values="1;1;1" dur="11s" repeatCount="indefinite"/>
  </g>
</svg>
